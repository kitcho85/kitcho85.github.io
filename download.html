<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Draw To Save: Sleeping Turtle</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#081b25;
    font-family:Arial, sans-serif;
    color:white;
    overflow:hidden;
    touch-action:none;
}

#gameWrapper{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#081b25;
}

#game{
    position:relative;
    width:min(100vw, 1200px);
    height:min(100vh, 750px);
    aspect-ratio:16 / 9;
    overflow:hidden;
    background:#123;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,0,0,.8);
}

/* BACKGROUND */

#background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    user-select:none;
}

/* DARK OVERLAY */

#shade{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.15),
        rgba(0,0,0,.05)
    );
    pointer-events:none;
}

/* HEADER */

#topBar{
    position:absolute;
    top:18px;
    left:0;
    width:100%;
    text-align:center;
    z-index:10;
}

#title{
    font-size:clamp(24px, 4vw, 48px);
    font-weight:900;
    text-shadow:
        0 4px 0 #073,
        0 8px 15px rgba(0,0,0,.7);
}

#title span{
    color:#ffd42a;
}

#subtitle{
    margin-top:6px;
    font-size:clamp(14px, 2vw, 22px);
    font-weight:bold;
    text-shadow:0 2px 4px black;
}

#subtitle span{
    color:#ffd42a;
}

/* LEVEL */

#level{
    position:absolute;
    top:100px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 30px;
    border-radius:30px;
    background:rgba(5,28,35,.88);
    border:2px solid rgba(255,255,255,.25);
    font-size:20px;
    font-weight:bold;
    z-index:10;
}

/* HIVE */

#hiveArea{
    position:absolute;
    left:4%;
    top:23%;
    width:150px;
    z-index:5;
    text-align:center;
    pointer-events:none;
}

#hive{
    width:110px;
    height:110px;
    object-fit:contain;
    filter:drop-shadow(0 7px 8px rgba(0,0,0,.5));
}

#hiveText{
    margin-top:-5px;
    background:rgba(8,29,35,.85);
    border:2px solid rgba(255,255,255,.2);
    border-radius:15px;
    padding:8px 10px;
    font-weight:bold;
    font-size:14px;
}

/* TURTLE */

#turtle{
    position:absolute;
    width:180px;
    bottom:8%;
    left:50%;
    transform:translateX(-50%);
    z-index:6;
    filter:
        drop-shadow(0 10px 8px rgba(0,0,0,.5));
    pointer-events:none;
    user-select:none;
}

/* DRAW AREA */

#drawZone{
    position:absolute;
    left:13%;
    right:13%;
    bottom:4%;
    height:28%;
    border:3px dashed rgba(255,255,255,.85);
    border-radius:20px;
    z-index:8;
}

#drawLabel{
    position:absolute;
    top:-47px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(7,34,38,.9);
    border-radius:12px;
    padding:10px 18px;
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

/* CANVAS */

#drawCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:20;
    cursor:crosshair;
    touch-action:none;
}

/* MESSAGE */

#message{
    position:absolute;
    top:42%;
    left:50%;
    transform:translate(-50%,-50%);
    width:80%;
    text-align:center;
    font-size:clamp(18px,3vw,32px);
    font-weight:bold;
    text-shadow:0 3px 8px black;
    z-index:9;
    pointer-events:none;
    transition:.3s;
}

#message.hide{
    opacity:0;
}

/* MUSIC BUTTON */

#musicButton{
    position:absolute;
    right:20px;
    top:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.5);
    background:rgba(4,30,45,.9);
    color:white;
    font-size:28px;
    cursor:pointer;
    z-index:30;
}

/* TIMER */

#timer{
    position:absolute;
    left:20px;
    top:20px;
    background:rgba(4,30,45,.9);
    border:2px solid rgba(255,255,255,.35);
    padding:12px 22px;
    border-radius:30px;
    font-size:24px;
    font-weight:bold;
    z-index:30;
}

/* BEE */

.bee{
    position:absolute;
    width:55px;
    height:auto;
    z-index:7;
    pointer-events:none;
    user-select:none;
    filter:drop-shadow(2px 5px 4px rgba(0,0,0,.45));
}

/* START BUTTON */

#startHint{
    position:absolute;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    background:rgba(5,25,30,.88);
    border:2px solid rgba(255,255,255,.3);
    border-radius:18px;
    padding:14px 25px;
    font-size:18px;
    font-weight:bold;
    z-index:15;
    pointer-events:none;
}

/* WIN */

#winPanel{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    z-index:50;
}

#winBox{
    width:min(85%,500px);
    text-align:center;
    padding:35px;
    border-radius:30px;
    background:linear-gradient(180deg,#123c40,#082126);
    border:2px solid #4caf50;
    box-shadow:0 10px 40px black;
}

#winBox h2{
    font-size:42px;
    color:#8cff66;
    margin-bottom:15px;
}

#winBox img{
    width:180px;
    margin:10px 0;
}

#winBox p{
    font-size:20px;
    margin:15px 0;
}

#downloadButton{
    display:block;
    margin-top:20px;
    padding:18px;
    border-radius:18px;
    background:#2e9e50;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
    box-shadow:0 5px 0 #17632d;
}

#downloadButton:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #17632d;
}

/* MOBILE */

@media(max-width:600px){

    #game{
        width:100vw;
        height:100vh;
        aspect-ratio:auto;
        border-radius:0;
    }

    #hiveArea{
        transform:scale(.7);
        transform-origin:left top;
    }

    #turtle{
        width:130px;
    }

    .bee{
        width:40px;
    }

    #level{
        top:75px;
        font-size:15px;
        padding:7px 20px;
    }

    #timer{
        top:12px;
        left:12px;
        font-size:18px;
    }

    #musicButton{
        top:12px;
        right:12px;
        width:48px;
        height:48px;
    }

}

</style>

</head>

<body>

<div id="gameWrapper">

<div id="game">

<img
id="background"
src="images/beach.png"
alt="Beach">

<div id="shade"></div>

<div id="topBar">

<div id="title">
DRAW <span>TO SAVE</span>
</div>

<div id="subtitle">
Sleeping Turtle • Draw <span>ONE</span> line to protect the turtle!
</div>

</div>

<div id="level">
LEVEL 1
</div>

<div id="timer">
⏱ <span id="time">30</span>
</div>

<button id="musicButton">
🔊
</button>

<!-- HIVE -->

<div id="hiveArea">

<img
id="hive"
src="images/ChatGPT%20Image%2016%20mai%202026%2C%2022_32_40.png"
alt="Bee Hive">

<div id="hiveText">
🐝 BEE HIVE
</div>

</div>

<!-- TURTLE -->

<img
id="turtle"
src="images/0bee2.png"
alt="Sleeping Turtle">

<!-- MESSAGE -->

<div id="message">
Protect the sleeping turtle!
</div>

<!-- DRAW ZONE -->

<div id="drawZone">

<div id="drawLabel">
DRAW HERE ↓
</div>

</div>

<canvas id="drawCanvas"></canvas>

<div id="startHint">
✏️ Draw one line to start!
</div>

<!-- WIN PANEL -->

<div id="winPanel">

<div id="winBox">

<h2>YOU SAVED<br>THE TURTLE! 🎉</h2>

<img
src="images/0bee2.png"
alt="Sleeping Turtle">

<p>
Want more challenges?<br>
Play <b>100+ unique levels</b>!
</p>

<a
id="downloadButton"
href="https://play.google.com/store/apps/details?id=com.kitcho85.savethesleepingturtle"
target="_blank">

▶ DOWNLOAD ON GOOGLE PLAY

</a>

</div>

</div>

</div>

</div>


<!-- AUDIO -->

<audio
id="bgMusic"
loop
preload="auto">

<source
src="images/leberch-whimsical-250869.mp3"
type="audio/mpeg">

</audio>


<audio
id="beeSound"
loop
preload="auto">

<source
src="images/bee%20sound.mp3"
type="audio/mpeg">

</audio>


<script>

/* =========================
   ELEMENTS
========================= */

const game = document.getElementById("game");

const canvas = document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

const bgMusic = document.getElementById("bgMusic");

const beeSound = document.getElementById("beeSound");

const musicButton = document.getElementById("musicButton");

const startHint = document.getElementById("startHint");

const message = document.getElementById("message");

const timerText = document.getElementById("time");

const turtle = document.getElementById("turtle");

const hive = document.getElementById("hive");

const winPanel = document.getElementById("winPanel");


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    const rect = game.getBoundingClientRect();

    canvas.width = rect.width;
    canvas.height = rect.height;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   DRAW SYSTEM
========================= */

let drawing = false;

let lineStarted = false;

let lineFinished = false;

let points = [];


function getPosition(e){

    const rect = canvas.getBoundingClientRect();

    let x;
    let y;

    if(e.touches){

        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;

    }else{

        x = e.clientX - rect.left;
        y = e.clientY - rect.top;

    }

    return {x,y};

}


function startDrawing(e){

    if(lineFinished) return;

    e.preventDefault();

    drawing = true;

    lineStarted = true;

    const p = getPosition(e);

    points.push(p);

    ctx.beginPath();

    ctx.moveTo(p.x,p.y);

}


function draw(e){

    if(!drawing || lineFinished) return;

    e.preventDefault();

    const p = getPosition(e);

    points.push(p);

    ctx.lineTo(p.x,p.y);

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 12;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.shadowColor = "#1aff76";

    ctx.shadowBlur = 12;

    ctx.stroke();

    ctx.shadowBlur = 0;

}


function stopDrawing(){

    if(!drawing || lineFinished) return;

    drawing = false;

    if(points.length < 2){

        points = [];

        return;

    }

    lineFinished = true;

    startGame();

}


canvas.addEventListener("mousedown",startDrawing);

canvas.addEventListener("mousemove",draw);

canvas.addEventListener("mouseup",stopDrawing);

canvas.addEventListener("mouseleave",stopDrawing);

canvas.addEventListener("touchstart",startDrawing,{passive:false});

canvas.addEventListener("touchmove",draw,{passive:false});

canvas.addEventListener("touchend",stopDrawing);


/* =========================
   BEE SYSTEM
========================= */

const bees = [];

let beesStarted = false;


/*
النحل كامل كيبقى واقف
حتى user يرسم الخط.
*/

function createBee(){

    const bee = document.createElement("img");

    bee.src = "images/bee.png";

    bee.className = "bee";

    game.appendChild(bee);

    const hiveRect = hive.getBoundingClientRect();

    const gameRect = game.getBoundingClientRect();

    const startX =
        hiveRect.left - gameRect.left +
        hiveRect.width / 2;

    const startY =
        hiveRect.top - gameRect.top +
        hiveRect.height / 2;

    const data = {

        element:bee,

        x:startX,

        y:startY,

        speed:0.6 + Math.random() * 0.5,

        offsetX:(Math.random() - .5) * 120,

        offsetY:(Math.random() - .5) * 100,

        angle:Math.random() * Math.PI * 2,

        alive:true

    };

    bee.style.left = data.x + "px";

    bee.style.top = data.y + "px";

    bees.push(data);

}


/* 8 BEES */

for(let i = 0; i < 8; i++){

    createBee();

}


/* =========================
   START GAME
========================= */

function startGame(){

    if(beesStarted) return;

    beesStarted = true;

    startHint.style.display = "none";

    message.classList.add("hide");


    /*
    MUSIC
    كتبدأ غير من بعد interaction
    ديال user مع الصفحة.
    */

    bgMusic.volume = 0.35;

    bgMusic.play().catch(()=>{});


    beeSound.volume = 0.25;

    beeSound.play().catch(()=>{});


    animateBees();

    startTimer();

}


/* =========================
   BEE MOVEMENT
========================= */

function animateBees(){

    if(!beesStarted) return;

    const gameRect = game.getBoundingClientRect();

    const turtleRect = turtle.getBoundingClientRect();


    const turtleX =
        turtleRect.left -
        gameRect.left +
        turtleRect.width / 2;

    const turtleY =
        turtleRect.top -
        gameRect.top +
        turtleRect.height / 2;


    bees.forEach((bee,index)=>{

        if(!bee.alive) return;


        /*
        حركة النحلة نحو السلحفاة
        مع حركة طبيعية بسيطة
        */

        const targetX =
            turtleX + bee.offsetX;

        const targetY =
            turtleY + bee.offsetY;


        let dx =
            targetX - bee.x;

        let dy =
            targetY - bee.y;


        const distance =
            Math.sqrt(dx*dx + dy*dy);


        if(distance > 5){

            bee.x +=
                (dx / distance) *
                bee.speed;

            bee.y +=
                (dy / distance) *
                bee.speed;

        }


        bee.angle += 0.08;


        bee.x +=
            Math.cos(bee.angle) * 0.7;

        bee.y +=
            Math.sin(bee.angle * 1.7) * 0.7;


        /*
        Collision بسيطة مع الخط
        */

        if(
            lineHitsBee(
                bee.x + 25,
                bee.y + 25
            )
        ){

            /*
            النحلة ما كتدوزش
            كترد للوراء
            */

            bee.x -=
                (dx / Math.max(distance,1))
                * 3;

            bee.y -=
                (dy / Math.max(distance,1))
                * 3;

        }


        bee.element.style.left =
            bee.x + "px";

        bee.element.style.top =
            bee.y + "px";


    });


    requestAnimationFrame(animateBees);

}


/* =========================
   LINE COLLISION
========================= */

function lineHitsBee(x,y){

    const radius = 35;


    for(let i = 0; i < points.length - 1; i++){

        const a = points[i];

        const b = points[i + 1];

        const distance =
            pointToSegmentDistance(
                x,y,
                a.x,a.y,
                b.x,b.y
            );


        if(distance < radius){

            return true;

        }

    }


    return false;

}


function pointToSegmentDistance(
    px,py,
    x1,y1,
    x2,y2
){

    const dx = x2 - x1;

    const dy = y2 - y1;


    if(dx === 0 && dy === 0){

        return Math.hypot(
            px - x1,
            py - y1
        );

    }


    const t =
        Math.max(
            0,
            Math.min(
                1,
                (
                    (px-x1)*dx +
                    (py-y1)*dy
                ) /
                (dx*dx + dy*dy)
            )
        );


    const xx = x1 + t * dx;

    const yy = y1 + t * dy;


    return Math.hypot(
        px - xx,
        py - yy
    );

}


/* =========================
   TIMER
========================= */

let time = 30;

let timerInterval;


function startTimer(){

    timerInterval = setInterval(()=>{

        time--;

        timerText.textContent = time;


        if(time <= 0){

            clearInterval(timerInterval);

            winGame();

        }

    },1000);

}


/* =========================
   WIN GAME
========================= */

function winGame(){

    beesStarted = false;

    beeSound.pause();

    bgMusic.pause();

    winPanel.style.display = "flex";

}


/* =========================
   MUSIC BUTTON
========================= */

let musicOn = true;


musicButton.addEventListener("click",()=>{

    if(musicOn){

        bgMusic.pause();

        beeSound.pause();

        musicButton.textContent = "🔇";

        musicOn = false;

    }else{

        if(lineFinished){

            bgMusic.play().catch(()=>{});

            beeSound.play().catch(()=>{});

        }

        musicButton.textContent = "🔊";

        musicOn = true;

    }

});

</script>

</body>

</html>
