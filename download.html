<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save The Sleeping Turtle - Play Now</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#10242b;
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;
}

.header{
    text-align:center;
    padding:25px 15px 15px;
}

.header h1{
    font-size:clamp(30px,6vw,48px);
    margin-bottom:10px;
}

.header p{
    font-size:clamp(17px,3vw,24px);
    color:#dcecff;
}

.gameWrapper{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:10px;
}

.gameBox{
    position:relative;
    width:100%;
    height:min(75vh,650px);
    min-height:500px;

    background:
    linear-gradient(
        rgba(0,0,0,.12),
        rgba(0,0,0,.28)
    ),
    url("images/beach.png");

    background-size:cover;
    background-position:center;

    border-radius:28px;
    overflow:hidden;

    border:5px solid rgba(255,255,255,.3);

    box-shadow:
    0 15px 45px rgba(0,0,0,.55);

    touch-action:none;
}


/* =========================
   TOP UI
========================= */

.gameUI{
    position:absolute;
    top:15px;
    left:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 18px;
    z-index:50;
    pointer-events:none;
}

.timer,
.beeCounter{
    background:rgba(0,0,0,.65);
    padding:10px 18px;
    border-radius:25px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.message{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    width:90%;

    text-align:center;

    font-size:clamp(18px,3vw,28px);
    font-weight:bold;

    text-shadow:
    2px 3px 5px black;

    z-index:40;
    pointer-events:none;
}


/* =========================
   TURTLE
========================= */

.turtle{
    position:absolute;

    width:150px;
    max-width:24%;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    z-index:15;

    pointer-events:none;
    user-select:none;

    filter:
    drop-shadow(
        0 8px 7px rgba(0,0,0,.55)
    );
}


/* =========================
   BEES
========================= */

.bee{
    position:absolute;

    width:58px;

    z-index:20;

    pointer-events:none;
    user-select:none;

    filter:
    drop-shadow(
        0 5px 5px rgba(0,0,0,.55)
    );

    transition:transform .05s linear;
}


/* =========================
   CANVAS
========================= */

#drawCanvas{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:30;

    cursor:crosshair;
}


/* =========================
   START SCREEN
========================= */

.startScreen{
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        rgba(0,0,0,.4),
        rgba(0,0,0,.65)
    );

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    z-index:100;
}

.startScreen h2{
    font-size:clamp(34px,7vw,58px);
    margin-bottom:18px;

    text-shadow:
    3px 4px 8px black;
}

.startScreen p{
    max-width:600px;

    font-size:clamp(18px,3vw,25px);

    line-height:1.5;
}

.playButton{
    margin-top:30px;

    border:none;

    border-radius:60px;

    padding:18px 55px;

    font-size:25px;
    font-weight:bold;

    color:white;

    background:#32bd70;

    cursor:pointer;

    box-shadow:
    0 8px 0 #167b43,
    0 12px 25px rgba(0,0,0,.4);

    transition:.15s;
}

.playButton:active{
    transform:translateY(6px);

    box-shadow:
    0 2px 0 #167b43;
}


/* =========================
   RESULT SCREEN
========================= */

.resultScreen{
    position:absolute;
    inset:0;

    background:
    rgba(0,0,0,.78);

    display:none;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    z-index:200;
}

.resultScreen h2{
    font-size:clamp(35px,7vw,60px);
    margin-bottom:18px;
}

.resultScreen p{
    max-width:600px;

    font-size:20px;
    line-height:1.5;
}

.downloadButton{
    display:inline-block;

    margin-top:30px;

    padding:19px 42px;

    border-radius:60px;

    background:#35c56f;

    color:white;

    text-decoration:none;

    font-size:22px;
    font-weight:bold;

    box-shadow:
    0 7px 0 #167b43;
}

.downloadButton:active{
    transform:translateY(5px);

    box-shadow:
    0 2px 0 #167b43;
}

.retryButton{
    margin-top:22px;

    background:transparent;

    border:2px solid white;

    color:white;

    padding:12px 28px;

    border-radius:40px;

    font-size:18px;

    cursor:pointer;
}


@media(max-width:600px){

    .gameBox{
        min-height:520px;
        height:70vh;
        border-radius:20px;
    }

    .turtle{
        width:125px;
        max-width:35%;
    }

    .bee{
        width:48px;
    }

    .message{
        top:75px;
    }

    .gameUI{
        padding:0 10px;
    }

    .timer,
    .beeCounter{
        font-size:16px;
        padding:8px 12px;
    }

}

</style>

</head>


<body>


<div class="header">

<h1>Save The Sleeping Turtle</h1>

<p>Draw a line. Protect the turtle. Survive!</p>

</div>


<div class="gameWrapper">

<div class="gameBox" id="gameBox">


<div class="gameUI">

<div class="timer">
⏱ <span id="timer">30</span>
</div>

<div class="beeCounter">
🐝 <span id="beeCounter">8</span>
</div>

</div>


<div
class="message"
id="message">

Draw ONE line to protect the turtle!

</div>


<img
src="images/bee2.png"
class="turtle"
id="turtle"
alt="Sleeping Turtle">


<canvas id="drawCanvas"></canvas>


<div
class="startScreen"
id="startScreen">

<h2>Protect The Turtle! 🐢</h2>

<p>

Eight angry bees are coming!
Draw one strong protective line and survive for 30 seconds.

</p>

<button
class="playButton"
onclick="startGame()">

PLAY NOW

</button>

</div>


<div
class="resultScreen"
id="resultScreen">

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<a
href="https://play.google.com/store/apps/details?id=com.kitcho85.savethesleepingturtle"
class="downloadButton"
target="_blank">

DOWNLOAD FULL GAME

</a>

<button
class="retryButton"
onclick="restartGame()">

PLAY AGAIN

</button>

</div>


</div>

</div>


<script>


const gameBox =
document.getElementById("gameBox");

const canvas =
document.getElementById("drawCanvas");

const ctx =
canvas.getContext("2d");

const turtle =
document.getElementById("turtle");

const timerElement =
document.getElementById("timer");

const beeCounter =
document.getElementById("beeCounter");

const message =
document.getElementById("message");

const startScreen =
document.getElementById("startScreen");

const resultScreen =
document.getElementById("resultScreen");

const resultTitle =
document.getElementById("resultTitle");

const resultText =
document.getElementById("resultText");


let drawing = false;
let lineDrawn = false;
let gameRunning = false;

let timer = 30;

let timerInterval;

let animationFrame;

let bees = [];

let linePoints = [];


/* =========================
   SOUND
========================= */

let audioContext;


function initSound(){

    if(!audioContext){

        audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

}


function playTone(
frequency,
duration,
type = "sine",
volume = 0.08
){

    if(!audioContext)
    return;


    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();


    oscillator.type =
    type;

    oscillator.frequency.value =
    frequency;


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );

}


function beeSound(){

    playTone(
        180,
        .08,
        "sawtooth",
        .025
    );

}


function drawSound(){

    playTone(
        700,
        .05,
        "sine",
        .035
    );

}


function winSound(){

    playTone(523,.12,"square",.07);

    setTimeout(
        ()=>playTone(659,.12,"square",.07),
        120
    );

    setTimeout(
        ()=>playTone(784,.25,"square",.08),
        240
    );

}


function loseSound(){

    playTone(
        150,
        .4,
        "sawtooth",
        .1
    );

}


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    canvas.width =
    gameBox.clientWidth;

    canvas.height =
    gameBox.clientHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   CREATE BEES
========================= */

function createBees(){

    document
    .querySelectorAll(".bee")
    .forEach(
        bee => bee.remove()
    );


    bees = [];


    const positions = [

        [8,15],
        [25,8],
        [50,12],
        [72,7],
        [88,18],
        [12,35],
        [80,38],
        [50,28]

    ];


    positions.forEach(
    (position,index)=>{


        const bee =
        document.createElement("img");


        bee.src =
        "images/bee.png";


        bee.className =
        "bee";


        gameBox.appendChild(bee);


        const x =
        gameBox.clientWidth *
        position[0] / 100;


        const y =
        gameBox.clientHeight *
        position[1] / 100;


        bees.push({

            element:bee,

            x:x,

            y:y,

            vx:0,

            vy:0,

            speed:
            0.35 +
            Math.random() * 0.18,

            angle:
            Math.random() *
            Math.PI * 2

        });


        updateBeePosition(
            bees[index]
        );


    });

}


/* =========================
   UPDATE BEE POSITION
========================= */

function updateBeePosition(bee){

    bee.element.style.left =
    bee.x + "px";

    bee.element.style.top =
    bee.y + "px";


    const rotation =
    Math.atan2(
        bee.vy,
        bee.vx
    ) * 180 / Math.PI;


    bee.element.style.transform =
    "rotate(" +
    (rotation + 90) +
    "deg)";

}


/* =========================
   GET TURTLE POSITION
========================= */

function getTurtlePosition(){

    return {

        x:
        turtle.offsetLeft +
        turtle.offsetWidth / 2,

        y:
        turtle.offsetTop +
        turtle.offsetHeight / 2,

        radius:
        Math.min(
            turtle.offsetWidth,
            turtle.offsetHeight
        ) * .30

    };

}


/* =========================
   DISTANCE TO LINE SEGMENT
========================= */

function distanceToSegment(
px,
py,
x1,
y1,
x2,
y2
){

    const dx =
    x2 - x1;

    const dy =
    y2 - y1;


    if(
        dx === 0 &&
        dy === 0
    ){

        return Math.hypot(
            px - x1,
            py - y1
        );

    }


    const t =
    Math.max(
        0,
        Math.min(
            1,
            (
                (px-x1)*dx +
                (py-y1)*dy
            ) /
            (dx*dx + dy*dy)
        )
    );


    const closestX =
    x1 + t * dx;

    const closestY =
    y1 + t * dy;


    return Math.hypot(
        px - closestX,
        py - closestY
    );

}


/* =========================
   LINE COLLISION
========================= */

function beeHitsLine(bee){

    if(
        linePoints.length < 2
    )
    return false;


    const beeRadius =
    bee.element.offsetWidth * .38;


    for(
        let i = 0;
        i < linePoints.length - 1;
        i++
    ){

        const p1 =
        linePoints[i];

        const p2 =
        linePoints[i+1];


        const distance =
        distanceToSegment(

            bee.x +
            bee.element.offsetWidth / 2,

            bee.y +
            bee.element.offsetHeight / 2,

            p1.x,
            p1.y,

            p2.x,
            p2.y

        );


        if(
            distance <
            beeRadius + 9
        ){

            return true;

        }

    }


    return false;

}


/* =========================
   DRAWING
========================= */

function getPosition(e){

    const rect =
    canvas.getBoundingClientRect();


    const point =
    e.touches ?
    e.touches[0] :
    e;


    return {

        x:
        point.clientX -
        rect.left,

        y:
        point.clientY -
        rect.top

    };

}


function startDraw(e){

    if(
        !gameRunning ||
        lineDrawn
    )
    return;


    e.preventDefault();


    drawing = true;


    const pos =
    getPosition(e);


    linePoints = [pos];


    ctx.beginPath();

    ctx.moveTo(
        pos.x,
        pos.y
    );


    drawSound();

}


function draw(e){

    if(!drawing)
    return;


    e.preventDefault();


    const pos =
    getPosition(e);


    linePoints.push(pos);


    ctx.lineTo(
        pos.x,
        pos.y
    );


    ctx.strokeStyle =
    "#ffffff";


    ctx.lineWidth =
    12;


    ctx.lineCap =
    "round";


    ctx.lineJoin =
    "round";


    ctx.shadowColor =
    "rgba(0,0,0,.7)";


    ctx.shadowBlur =
    8;


    ctx.stroke();


}


function stopDraw(){

    if(!drawing)
    return;


    drawing = false;

    lineDrawn = true;


    message.innerHTML =
    "The bees cannot cross your line! 🛡️";


    drawSound();

}


/* MOUSE */

canvas.addEventListener(
    "mousedown",
    startDraw
);

canvas.addEventListener(
    "mousemove",
    draw
);

window.addEventListener(
    "mouseup",
    stopDraw
);


/* TOUCH */

canvas.addEventListener(
    "touchstart",
    startDraw,
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    draw,
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    stopDraw
);


/* =========================
   START GAME
========================= */

function startGame(){

    initSound();


    startScreen.style.display =
    "none";


    resultScreen.style.display =
    "none";


    gameRunning =
    true;


    drawing =
    false;


    lineDrawn =
    false;


    linePoints =
    [];


    timer =
    30;


    timerElement.innerHTML =
    timer;


    message.innerHTML =
    "Draw ONE line to protect the turtle!";


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    createBees();


    clearInterval(
        timerInterval
    );


    timerInterval =
    setInterval(
    ()=>{


        if(!gameRunning)
        return;


        timer--;


        timerElement.innerHTML =
        timer;


        if(
            timer === 20
        ){

            message.innerHTML =
            "Keep protecting the turtle!";

        }


        if(
            timer === 10
        ){

            message.innerHTML =
            "Only 10 seconds left! 🔥";

        }


        if(
            timer <= 0
        ){

            winGame();

        }


    },
    1000
    );


    moveBees();

}


/* =========================
   BEE AI
========================= */

function moveBees(){

    if(!gameRunning)
    return;


    const turtlePos =
    getTurtlePosition();


    bees.forEach(
    bee=>{


        const beeCenterX =
        bee.x +
        bee.element.offsetWidth / 2;


        const beeCenterY =
        bee.y +
        bee.element.offsetHeight / 2;


        let dx =
        turtlePos.x -
        beeCenterX;


        let dy =
        turtlePos.y -
        beeCenterY;


        const distance =
        Math.hypot(dx,dy);


        if(distance > 0){

            dx /= distance;

            dy /= distance;

        }


        /* Move toward turtle */

        bee.vx +=
        dx *
        bee.speed *
        .035;


        bee.vy +=
        dy *
        bee.speed *
        .035;


        /* Small natural movement */

        bee.vx +=
        Math.sin(
            Date.now()/350 +
            bee.x
        ) * .02;


        bee.vy +=
        Math.cos(
            Date.now()/300 +
            bee.y
        ) * .02;


        /* Limit speed */

        const velocity =
        Math.hypot(
            bee.vx,
            bee.vy
        );


        const maxSpeed =
        2.0;


        if(
            velocity > maxSpeed
        ){

            bee.vx =
            bee.vx /
            velocity *
            maxSpeed;


            bee.vy =
            bee.vy /
            velocity *
            maxSpeed;

        }


        const oldX =
        bee.x;

        const oldY =
        bee.y;


        bee.x +=
        bee.vx;

        bee.y +=
        bee.vy;


        /* =====================
           LINE COLLISION
        ===================== */

        if(
            beeHitsLine(bee)
        ){

            bee.x =
            oldX;

            bee.y =
            oldY;


            /*
            Bounce away
            */

            bee.vx *= -1.4;

            bee.vy *= -1.4;


            /*
            Add random side movement
            */

            bee.vx +=
            (Math.random()-.5) *
            1.8;


            bee.vy +=
            (Math.random()-.5) *
            1.8;


            beeSound();

        }


        /* =====================
           WALLS
        ===================== */

        if(
            bee.x < 0
        ){

            bee.x = 0;

            bee.vx *= -1;

        }


        if(
            bee.x >
            gameBox.clientWidth -
            bee.element.offsetWidth
        ){

            bee.x =
            gameBox.clientWidth -
            bee.element.offsetWidth;

            bee.vx *= -1;

        }


        if(
            bee.y < 100
        ){

            bee.y = 100;

            bee.vy *= -1;

        }


        if(
            bee.y >
            gameBox.clientHeight -
            bee.element.offsetHeight
        ){

            bee.y =
            gameBox.clientHeight -
            bee.element.offsetHeight;

            bee.vy *= -1;

        }


        updateBeePosition(
            bee
        );


        /* =====================
           TURTLE COLLISION
        ===================== */

        const newCenterX =
        bee.x +
        bee.element.offsetWidth / 2;


        const newCenterY =
        bee.y +
        bee.element.offsetHeight / 2;


        const turtleDistance =
        Math.hypot(

            turtlePos.x -
            newCenterX,

            turtlePos.y -
            newCenterY

        );


        if(
            turtleDistance <
            turtlePos.radius +
            bee.element.offsetWidth * .28
        ){

            loseGame();

        }


    });


    beeCounter.innerHTML =
    bees.length;


    animationFrame =
    requestAnimationFrame(
        moveBees
    );

}


/* =========================
   WIN
========================= */

function winGame(){

    if(!gameRunning)
    return;


    gameRunning =
    false;


    clearInterval(
        timerInterval
    );


    cancelAnimationFrame(
        animationFrame
    );


    winSound();


    resultTitle.innerHTML =
    "YOU SAVED THE TURTLE! 🎉🐢";


    resultText.innerHTML =
    "Amazing! You survived the angry bees. Think you can beat over 100 challenging levels?";


    resultScreen.style.display =
    "flex";

}


/* =========================
   LOSE
========================= */

function loseGame(){

    if(!gameRunning)
    return;


    gameRunning =
    false;


    clearInterval(
        timerInterval
    );


    cancelAnimationFrame(
        animationFrame
    );


    loseSound();


    resultTitle.innerHTML =
    "OH NO! 🐝";


    resultText.innerHTML =
    "The bees reached the turtle! Try again or play the full game with over 100 levels.";


    resultScreen.style.display =
    "flex";

}


/* =========================
   RESTART
========================= */

function restartGame(){

    resultScreen.style.display =
    "none";


    gameRunning =
    false;


    clearInterval(
        timerInterval
    );


    cancelAnimationFrame(
        animationFrame
    );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    linePoints =
    [];


    lineDrawn =
    false;


    bees.forEach(
    bee=>bee.element.remove()
    );


    bees = [];


    startScreen.style.display =
    "flex";


    timerElement.innerHTML =
    "30";


    beeCounter.innerHTML =
    "8";


}


</script>

</body>

</html>
